<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verwaltungsportal</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function showStartupError(message, detail) {
          var root = document.getElementById("root");
          if (!root || root.childElementCount > 0 || root.textContent.trim().length > 0) return;
          root.innerHTML =
            '<div style="min-height:100vh;background:#f8fafc;color:#0f172a;padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">' +
            '<div style="max-width:860px;margin:0 auto;background:white;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 1px 2px rgba(15,23,42,.08)">' +
            '<div style="font-size:15px;font-weight:700">App konnte nicht starten</div>' +
            '<div style="margin-top:8px;font-size:13px;color:#475569">Das HTML wurde geladen, aber die React-App wurde nicht gerendert.</div>' +
            '<pre style="margin-top:14px;white-space:pre-wrap;overflow:auto;background:#fff1f2;border:1px solid #fecdd3;border-radius:14px;padding:14px;font-size:12px;color:#881337">' +
            message +
            (detail ? "\n\n" + detail : "") +
            "\n\nURL: " +
            window.location.href +
            "</pre>" +
            '<div style="margin-top:12px;font-size:12px;color:#64748b">Bitte Browser-Konsole und Network-Tab prüfen: JS-Datei unter /assets/... muss Status 200 und Typ application/javascript haben.</div>' +
            "</div></div>";
        }

        window.addEventListener(
          "error",
          function (event) {
            showStartupError(event.message || "JavaScript-Fehler beim Laden.", event.filename || "");
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (event) {
          showStartupError("Unhandled promise rejection", String(event.reason || ""));
        });
        window.setTimeout(function () {
          showStartupError("Timeout: #root ist nach 5 Sekunden noch leer.", "Vermutlich wurde das JS-Bundle nicht geladen oder nicht ausgeführt.");
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
